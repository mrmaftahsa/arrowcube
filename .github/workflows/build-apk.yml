name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3a3a9c' --splashBackgroundColor '#3a3a9c'

      - name: Lock to portrait mode
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copy game files into the app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ArrowCube.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube-APK
          path: ArrowCube.apk

      - name: Publish APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Arrow Cube build ${{ github.run_number }}
          files: ArrowCube.apk
          make_latest: true

      - name: Save APK to the "apk" branch
        run: |
          mkdir out && cp ArrowCube.apk out/
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ArrowCube.apk
          git commit -qm "APK from build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
