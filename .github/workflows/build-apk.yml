name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3a3a9c' --splashBackgroundColor '#3a3a9c'

      - name: Lock to portrait mode
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copy game files into the app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ArrowCube.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowCube-APK
          path: ArrowCube.apk
